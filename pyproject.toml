[project]
name = "secure-ai-data-governance-control-plane"
version = "0.1.0"
description = "A policy decision point and data governance control plane for AI systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "iconbaypark2900" }]
keywords = ["governance", "policy", "pdp", "pep", "abac", "pii", "ai-security"]

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=25.1",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0.2",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "aiosqlite>=0.20",
    "types-pyyaml>=6.0",
]

[project.scripts]
cpctl = "control_plane.cli:app"

[project.urls]
Homepage = "https://github.com/iconbaypark2900/secure_ai_data_governance_control_plane"
Source = "https://github.com/iconbaypark2900/secure_ai_data_governance_control_plane"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
# S101: pytest relies on bare asserts.
# B008: FastAPI's Depends() in a default argument is the documented idiom.
# RUF012: mutable class attributes are how SQLAlchemy and Pydantic declare things.
# N818: domain exceptions read better without an Error suffix at the call site
#       (`except DecisionDenied`), and every one of them subclasses a clearly
#       named base -- ControlPlaneError, AdapterError -- so they stay findable.
ignore = ["S101", "B008", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"seed/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "ui/", "^tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a live Postgres database"]
filterwarnings = ["error::DeprecationWarning:control_plane.*"]

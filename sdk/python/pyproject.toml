[project]
name = "control-plane-sdk"
version = "0.1.0"
description = "Enforcement-point client for the Secure AI Data Governance Control Plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_plane_sdk"]

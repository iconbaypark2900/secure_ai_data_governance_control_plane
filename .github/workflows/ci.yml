name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never touch a real secret, but the settings validator wants these set.
  CP_ENVIRONMENT: test
  CP_AUDIT_HMAC_KEY: ci-audit-key
  CP_REDACTION_HMAC_KEY: ci-redaction-key

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector rather than plain postgres: it is postgres 17 with the
        # extension, and without it the vector-store tests skip -- which is how
        # a 332x sampling cost sat unnoticed in an adapter that had otherwise
        # been run against a real database.
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
          POSTGRES_DB: control_plane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U control_plane"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # Pinned, and with an API key set. Both matter: the adapter encodes
      # assumptions about qdrant's response shapes, and the authenticated case
      # is the one that exposed a health check reporting green on a
      # misconfiguration. Without a live instance these tests skip, which is
      # how the adapter shipped untested in the first place.
      qdrant:
        image: qdrant/qdrant:v1.19.0
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-key
        ports: ["6333:6333"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e '.[dev]'
          uv pip install -e ./sdk/python

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy control_plane

      - name: Test
        env:
          CP_TEST_POSTGRES_URL: postgresql+asyncpg://control_plane:control_plane@localhost:5432/control_plane_test
          CP_TEST_QDRANT_URL: http://localhost:6333
          CP_TEST_QDRANT_API_KEY: ci-qdrant-key
        run: .venv/bin/python -m pytest --cov=control_plane --cov-report=term-missing

      # The shipped policy set is a deliverable. A syntax error in it is a
      # broken release, not a documentation bug.
      - name: Validate the reference policy set
        run: .venv/bin/cpctl policy validate seed/policies.yaml

      # Migrations must actually apply to an empty database, and reverse
      # cleanly. Autogenerated migrations that were never run are a familiar way
      # to break a deploy. The schema is reset first because the test suite
      # creates its tables with create_all, not with Alembic.
      - name: Apply and reverse migrations against a clean database
        env:
          CP_DATABASE_URL: postgresql+asyncpg://control_plane:control_plane@localhost:5432/control_plane_test
        run: |
          .venv/bin/python scripts/reset_schema.py
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

  ui:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build

  sdk-typescript:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The contract fixture is generated from the Python SDK. If someone edits
      # the request body on one side and not the other, the two clients start
      # getting different decisions out of the same policy -- so regenerate it
      # here and fail if it moved.
      - name: The contract fixture is not stale
        working-directory: .
        run: |
          python3 -m venv /tmp/contract-venv
          /tmp/contract-venv/bin/pip install -q -e ./sdk/python
          /tmp/contract-venv/bin/python tools/generate_sdk_contract.py
          git diff --exit-code sdk/typescript/test/contract.json

  docker:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
